[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-music-composition-lab"
version = "0.1.0"
description = "An executable textbook for computational music composition"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Computational Music Composition Lab contributors"}]
dependencies = ["python-osc>=1.8,<2"]

[project.scripts]
composition-lab = "composition_lab.cli:main"

[tool.setuptools]
packages = ["composition_lab"]
